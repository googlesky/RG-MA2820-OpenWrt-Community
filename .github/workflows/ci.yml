name: Source tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y gettext jq
      - name: Validate translations
        run: msgfmt --check --check-format -o /dev/null luci-app-rg-ma2820/po/vi/rg-ma2820.po
      - name: Run source tests
        run: ./tools/run-source-tests.sh
